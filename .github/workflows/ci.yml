name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: npm test
      - name: Fixture smoke test (fetch + serve pipeline, no key)
        run: |
          node scripts/fetch-usage.mjs --fixture
          node -e "const d=require('./data.json'); if(!d.days?.length||!d.prices) throw new Error('bad data.json'); console.log('✓ data.json ok:', d.DAYS, 'days')"
